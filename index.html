<!DOCTYPE html>
<html lang="zh-CN">
   <head>
      <meta charset="utf-8">
      <!-- Strict CSP: everything is same-origin (fonts, images, the single script).
           No inline <style>/<script> is allowed, so keep new code in style.css / app.js. -->
      <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
      <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
      <title>随机密码生成器 by lingyicute - 精锻数字符印，永固赛博边关</title>
      <meta name="description" content="创建强大且安全的密码，保护您的在线账户安全。Made with ❤️ by lingyicute">
      <link rel="stylesheet" href="./style.css">
      <link rel="preload" href="./fonts/MierB03-SubsetEng-Regular.woff2" as="font" type="font/woff2" crossorigin>
      <link rel="preload" href="./fonts/MierB03-SubsetEng-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
      <link rel="apple-touch-icon" sizes="180x180" href="./images/icon/apple.png" />
      <link rel="shortcut icon" href="./favicon.ico" sizes="32x32" type="image/x-icon">
      <link rel="icon" href="./images/icon/192.png" sizes="192x192" type="image/png" />
      <link rel="icon" href="./images/icon/512.png" sizes="512x512" type="image/png" />
      <!-- Inline <style> inside <noscript> is blocked by the CSP above, so the
           no-JS fallback is a same-origin stylesheet instead. -->
      <noscript><link rel="stylesheet" href="./no-js.css"></noscript>
      <script src="./app.js" defer></script>
   </head>
   <body>
      <!-- 加载遮罩层 -->
      <div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
         <img src="./images/loading.svg" alt="" width="80" height="80" />
      </div>

      <noscript>
         <p class="no-js-notice">本工具需要启用 JavaScript 才能生成密码。</p>
      </noscript>

      <main>
         <section class="password-generator bg-white snipcss-HkWhy">
            <div class="container">
               <div class="row justify-content-center">
                  <div class="col-12 col-xl-10">
                     <h1 class="mb-16 text-center"><span>随机密码生成器</span></h1>
                     <p class="body-2 mb-32 mb-lg-40 text-center">精锻数字符印，永固赛博边关</p>
                     <div class="generator-container">
                        <div class="image-container"><img src="./images/a.svg" class="strength-level" alt="" width="416" height="312"></div>
                        <div class="generator">
                           <div class="input-container">
                              <div class="generator-input mb-16 mb-lg-0 me-lg-24">
                                 <div class="form-control-wrapper form-floating">
                                    <input id="password-output" type="text" class="form-control size-lg form-icon-after body-2 password" aria-label="生成的随机密码" aria-describedby="password-strength" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                                    <label id="password-strength" class="label label-sm tagline-sm bg-green-bright" aria-live="polite">很强</label>
                                    <div role="button" tabindex="0" aria-label="重新生成密码" title="重新生成密码" class="icon icon-24 icon-refresh"></div>
                                 </div>
                              </div>
                              <div class="btn-wrapper"><button type="button" id="pwd-copy-btn" class="btn full size-md theme-blue copy-btn">复制</button></div>
                           </div>
                           <p class="copy-feedback" role="status" aria-live="polite"></p>
                           <div class="generator-settings">
                              <div class="length-settings">
                                 <div><label for="length" class="first body-1 mb-16 mb-lg-0 me-lg-16 me-xl-48"><span>密码长度</span>: <span class="ms-8 ms-lg-16 fw-bold body-2">15</span></label></div>
                                 <div class="slider-settings">
                                    <button type="button" class="button-circle outline size-md theme-dark shadow-none me-12" aria-label="减少密码长度">
                                       <div aria-hidden="true" class="icon icon-16 icon-minus"></div>
                                    </button>
                                    <div class="slider-container">
                                       <input id="length" type="range" min="1" max="64" value="15" class="slider">
                                    </div>
                                    <button type="button" class="button-circle outline size-md theme-dark shadow-none ms-12" aria-label="增加密码长度">
                                       <div aria-hidden="true" class="icon icon-16 icon-plus"></div>
                                    </button>
                                 </div>
                              </div>
                              <div class="complexity-settings">
                                 <div><span id="charset-group-label" class="first body-1 mb-16 mb-lg-0 me-xl-24"><span>使用的字符</span>: </span></div>
                                 <div class="complexity-checkbox" role="group" aria-labelledby="charset-group-label" aria-describedby="charset-hint">
                                    <div>
                                       <div class="custom-control custom-checkbox"><input type="checkbox" id="uppercase" class="custom-control-input" aria-label="大写字母 A 到 Z" checked> <label for="uppercase" class="custom-control-label body-1 fw-bold" title="大写字母 (A-Z)">ABC</label></div>
                                    </div>
                                    <div>
                                       <div class="custom-control custom-checkbox"><input type="checkbox" id="lowercase" class="custom-control-input" aria-label="小写字母 a 到 z" checked> <label for="lowercase" class="custom-control-label body-1 fw-bold" title="小写字母 (a-z)">abc</label></div>
                                    </div>
                                    <div>
                                       <div class="custom-control custom-checkbox"><input type="checkbox" id="numbers" class="custom-control-input" aria-label="数字 0 到 9" checked> <label for="numbers" class="custom-control-label body-1 fw-bold" title="数字 (0-9)">123</label></div>
                                    </div>
                                    <div>
                                       <div class="custom-control custom-checkbox"><input type="checkbox" id="specials" class="custom-control-input" aria-label="特殊字符"> <label for="specials" class="custom-control-label body-1 fw-bold" title="特殊字符 (!@#$...)">#$&amp;</label></div>
                                    </div>
                                 </div>
                                 <p id="charset-hint" class="charset-hint" role="status"></p>
                              </div>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </section>
         <section class="section-py bg-orange-faint snipcss-DRkZf">
            <div class="container">
               <div class="row justify-content-center text-center">
                  <div class="col-12">
                     <h2 class="mb-40 mb-lg-56">什么因素决定密码强度？</h2>
                  </div>
               </div>
               <div class="row justify-content-center">
                  <div class="col-12 col-lg-3">
                     <div data-cmp-name="feature-item" class="feature-item size-sm centered border-orange-pale bg-orange-off-white">
                        <div class="feature-item-img"><img src="./images/password-checkmark--key-tick.svg" alt="" width="80" height="80" loading="lazy"></div>
                        <div class="feature-item-body">
                           <div class="h7 feature-item-title">长度</div>
                           <div class="body-4 feature-item-text">密码越长，安全性越高。单因素登录密码建议至少使用15个字符；更长且唯一的密码通常更难猜。</div>
                        </div>
                     </div>
                  </div>
                  <div class="col-12 col-lg-3">
                     <div data-cmp-name="feature-item" class="feature-item size-sm centered border-orange-pale bg-orange-off-white">
                        <div class="feature-item-img"><img src="./images/https-encryption--lock.svg" alt="" width="80" height="80" loading="lazy"></div>
                        <div class="feature-item-body">
                           <div class="h7 feature-item-title">复杂性</div>
                           <div class="body-4 feature-item-text">强密码应使用字母、数字、大小写和符号的组合，组成不易猜测的字符串。</div>
                        </div>
                     </div>
                  </div>
                  <div class="col-12 col-lg-3">
                     <div data-cmp-name="feature-item" class="feature-item size-sm centered border-orange-pale bg-orange-off-white">
                        <div class="feature-item-img"><img src="./images/sensitive-data-shield--document-fingerprint.svg" alt="" width="80" height="80" loading="lazy"></div>
                        <div class="feature-item-body">
                           <div class="h7 feature-item-title">唯一性</div>
                           <div class="body-4 feature-item-text">每个账户应使用唯一的密码，以抵御单一密码泄漏时的撞库攻击。</div>
                        </div>
                     </div>
                  </div>
               </div>
            </div>

            <footer class="container">
               <hr class="footer-divider">
               <p class="body-4 text-muted text-center">Copyright &copy; 2024 lingyicute · Made with love ❤️</p>
            </footer>
         </section>
      </main>

   </body>
</html>
